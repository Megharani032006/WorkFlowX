<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · WorkFlowX</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">✔ WorkFlowX</div>
    <h1>Create your account</h1>
    <p class="muted">Start tracking your tasks in under a minute.</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('register') }}">
      <label>Full name
        <input type="text" name="name" value="{{ name or '' }}" maxlength="80" required autofocus>
      </label>
      <label>Email
        <input type="email" name="email" value="{{ email or '' }}" required>
      </label>
      <label>Password <span class="muted">(at least 6 characters)</span>
        <input type="password" name="password" minlength="6" required>
      </label>
      <button class="btn primary block" type="submit">Create account</button>
    </form>
    <p class="muted center">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </main>
</body>
</html>
