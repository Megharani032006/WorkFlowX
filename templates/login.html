<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · WorkFlowX</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">✔ WorkFlowX</div>
    <h1>Log in</h1>
    <p class="muted">Pick up where you left off.</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    {% if success %}<div class="alert success">{{ success }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <label>Email
        <input type="email" name="email" value="{{ email or '' }}" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button class="btn primary block" type="submit">Log in</button>
    </form>
    <p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </main>
</body>
</html>
